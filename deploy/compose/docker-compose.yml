# Tamarind LOS — "Lite" topology for local development and demos.
#
#   cd deploy/compose
#   docker compose up --build
#
# Then call http://localhost:8080 (REST) or http://localhost:8080/mcp (MCP) with one of
# the development tokens in principals.yaml. The agents service starts working as soon
# as applications reach verification. Never expose this setup to real data.

name: tamarind

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tamarind_admin
      POSTGRES_PASSWORD: ${TAMARIND_ADMIN_DB_PASSWORD:-change-me-admin}
      POSTGRES_DB: tamarind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamarind_admin -d tamarind"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies migrations, sets the application role's password and seeds demo tenants.
  migrate:
    build:
      context: ../..
      dockerfile: services/core/Dockerfile
    image: tamarind-core:dev
    command: ["migrate", "--seed"]
    environment:
      TAMARIND_ADMIN_DATABASE_URL: postgres://tamarind_admin:${TAMARIND_ADMIN_DB_PASSWORD:-change-me-admin}@postgres:5432/tamarind?sslmode=disable
      TAMARIND_APP_DB_PASSWORD: ${TAMARIND_APP_DB_PASSWORD:-change-me-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The tool gateway. Connects as tamarind_app, so row-level security always applies.
  core:
    image: tamarind-core:dev
    command: ["serve"]
    environment:
      TAMARIND_DATABASE_URL: postgres://tamarind_app:${TAMARIND_APP_DB_PASSWORD:-change-me-app}@postgres:5432/tamarind?sslmode=disable
      TAMARIND_BLOB_DIR: /var/lib/tamarind/blobs
    volumes:
      - blobs:/var/lib/tamarind/blobs   # uploaded documents (S3-compatible storage in production)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Built-in agents (Python). They follow the event feed and act only through the
  # gateway, with their own tokens, so every call is authorized and audited.
  # Set TAMARIND_LLM_PROVIDER=anthropic, ANTHROPIC_API_KEY and TAMARIND_LLM_MODEL to
  # let a model draft credit memos; outcomes always come from the policy rules.
  agents:
    build:
      context: ../..
      dockerfile: services/agents/Dockerfile
    image: tamarind-agents:dev
    command: ["run"]
    environment:
      TAMARIND_URL: http://core:8080
      TAMARIND_INTAKE_TOKEN: dev-agent-intake
      TAMARIND_DOCUMENTS_TOKEN: dev-agent-documents
      TAMARIND_VERIFICATION_TOKEN: dev-agent-verification
      TAMARIND_UNDERWRITING_TOKEN: dev-agent-underwriting
      TAMARIND_LLM_PROVIDER: ${TAMARIND_LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAMARIND_LLM_MODEL: ${TAMARIND_LLM_MODEL:-}
    volumes:
      - agentstate:/home/agents/state
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  agentstate:
  blobs:
