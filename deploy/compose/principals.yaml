# DEVELOPMENT ONLY — static bearer tokens for local demos and tests.
# Never use this file with real data. Production deployments must replace it with
# OIDC (people) and OAuth 2.1 client credentials (agents and systems).

tenants:
  demo:
    name: Demo Lender
  other:
    name: Other Lender (used to test tenant isolation)

principals:
  # People
  - id: user:officer.ana
    name: Ana (loan officer)
    tenant: demo
    roles: [loan_officer]
    scopes: ["*"]
    token: dev-officer-ana

  - id: user:officer.chai
    name: Chai (loan officer)
    tenant: demo
    roles: [loan_officer]
    scopes: ["*"]
    token: dev-officer-chai

  - id: user:approver.ben
    name: Ben (credit approver, limit 25,000)
    tenant: demo
    roles: [credit_approver]
    scopes: ["*"]
    token: dev-approver-ben

  - id: user:approver.sara
    name: Sara (senior credit approver, limit 100,000)
    tenant: demo
    roles: [senior_credit_approver]
    scopes: ["*"]
    token: dev-approver-sara

  - id: user:ops.dana
    name: Dana (operations, books loans)
    tenant: demo
    roles: [operations]
    scopes: ["*"]
    token: dev-ops-dana

  # Agents
  - id: agent:intake
    name: Intake agent
    tenant: demo
    roles: [agent_intake]
    trust_level: L3
    scopes: [applications:read, applications:write, parties:write, documents:request, tasks:write, events:read]
    token: dev-agent-intake

  - id: agent:underwriting
    name: Underwriting analyst agent
    tenant: demo
    roles: [agent_underwriting]
    trust_level: L3
    scopes: [applications:read, policy:evaluate, decisions:recommend, events:read]
    token: dev-agent-underwriting

  - id: agent:documents
    name: Document agent (classifies, extracts and checks uploaded documents)
    tenant: demo
    roles: [agent_documents]
    trust_level: L3
    scopes: [applications:read, documents:process, events:read]
    token: dev-agent-documents

  - id: agent:verification
    name: Verification agent (KYC, KYB, sanctions, bureau, bank data)
    tenant: demo
    roles: [agent_verification]
    trust_level: L3
    scopes: [applications:read, checks:run, policy:evaluate, events:read]
    token: dev-agent-verification

  # Borrowers (portal users). A borrower acts only on applications linked to them.
  - id: borrower:mekong
    name: Mekong Trading Co. (borrower portal)
    tenant: demo
    roles: [borrower]
    scopes: [applications:read, consents:write, offers:accept, documents:write]
    token: dev-borrower-mekong

  # Another tenant
  - id: user:officer.zoe
    name: Zoe (loan officer at another lender)
    tenant: other
    roles: [loan_officer]
    scopes: ["*"]
    token: dev-other-zoe
