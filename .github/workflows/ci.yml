name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and agents — validate, vet, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: local # same as the Docker build: never switch toolchains silently
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Check modules are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Validate specs (tool catalogue, policy pack, state machine, CEL rule tests, Cedar)
        run: >
          go run ./cmd/tamarind validate
          --tools ../../tools
          --pack ../../policy-packs/baseline/sme-working-capital
          --principals ../../deploy/compose/principals.yaml

      - name: Test (unit + end-to-end against PostgreSQL 16)
        env:
          TAMARIND_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Agents — unit tests
        working-directory: services/agents
        run: python -m unittest discover -s tests -v

      - name: Agents — end-to-end against a live gateway
        env:
          ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          APP_URL: postgres://tamarind_app:ci-app-password@localhost:5432/postgres?sslmode=disable
          SPECS: --tools ../../tools --pack ../../policy-packs/baseline/sme-working-capital --principals ../../deploy/compose/principals.yaml
        run: |
          go build -o /tmp/tamarind ./cmd/tamarind
          TAMARIND_APP_DB_PASSWORD=ci-app-password /tmp/tamarind migrate --seed --database-url "$ADMIN_URL" $SPECS
          /tmp/tamarind serve --addr 127.0.0.1:8080 --database-url "$APP_URL" $SPECS > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          cd ../agents
          TAMARIND_URL=http://127.0.0.1:8080 python -m unittest tests.test_live -v || { cat /tmp/serve.log; exit 1; }

  image:
    name: Container image and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -f services/core/Dockerfile -t tamarind-core:ci .
      - name: Validate image contents
        run: docker run --rm --entrypoint tamarind tamarind-core:ci validate
      - name: Build agents image
        run: docker build -f services/agents/Dockerfile -t tamarind-agents:ci .
      - name: Agents image starts
        run: docker run --rm tamarind-agents:ci --help
      - name: Validate Compose file
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet
